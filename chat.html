<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#eff9ff">
<title>PONNU ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sky:#0ea5e9;--sky-deep:#0369a1;--accent:#0284c7;
  --soft:#e3f4ff;--soft-2:#d3ecff;
  --bg:#eef7ff;--card:#ffffff;
  --text:#0c2437;--muted:#61809a;--border:#d7eaf9;
  --mine:linear-gradient(135deg,#3ec2ff,#0a84d9);
  --shadow:0 18px 50px rgba(6,66,120,.14);
  --shadow-sm:0 6px 18px rgba(6,66,120,.08);
  --online:#22c55e;
}
body.dark{
  --sky:#38bdf8;--sky-deep:#0369a1;--accent:#38bdf8;
  --soft:#123349;--soft-2:#173b53;
  --bg:#081825;--card:#0e2333;
  --text:#eaf6ff;--muted:#84a9c2;--border:#1c3d54;
  --mine:linear-gradient(135deg,#3ec2ff,#0369a1);
  --shadow:0 18px 50px rgba(0,0,0,.5);
  --shadow-sm:0 6px 18px rgba(0,0,0,.35);
}
html{background:var(--bg)}
body{
  height:100vh;min-height:100dvh;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 0%,rgba(62,194,255,.30),transparent 40%),
    radial-gradient(circle at 100% 100%,rgba(10,132,217,.20),transparent 45%),
    linear-gradient(160deg,#eaf8ff,#dcf0ff);
  transition:background .3s ease,color .3s ease;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body.dark{background:
  radial-gradient(circle at 10% 0%,rgba(62,194,255,.14),transparent 40%),
  radial-gradient(circle at 100% 100%,rgba(3,105,161,.20),transparent 45%),
  linear-gradient(160deg,#071722,#0a1f2e);
}
button,input,textarea{font:inherit}
button{-webkit-tap-highlight-color:transparent}
textarea,input{font-size:16px}

.app{height:100vh;height:100dvh;display:flex;justify-content:center;align-items:center;padding:20px}
.chat-container{
  width:min(880px,100%);height:min(880px,94vh);min-height:0;
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--card);border:1px solid var(--border);
  border-radius:26px;box-shadow:var(--shadow);
  animation:appIn .45s ease both;
}

/* Header */
.chat-header{
  height:72px;flex:0 0 auto;
  padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));
  height:calc(72px + env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,var(--sky),var(--sky-deep));
  position:relative;z-index:10;
}
.profile{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{
  width:44px;height:44px;flex:0 0 44px;border-radius:50%;
  display:flex;justify-content:center;align-items:center;
  background:rgba(255,255,255,.22);color:#fff;
  font-size:19px;font-weight:800;overflow:hidden;
  border:2px solid rgba(255,255,255,.55);
}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile h2{font-size:16px;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.profile p{font-size:12px;color:rgba(255,255,255,.82);margin-top:2px;display:flex;align-items:center}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);margin-right:6px}
.status-dot.online{background:var(--online);box-shadow:0 0 0 0 rgba(34,197,94,.55);animation:pulseDot 2s infinite}
.header-actions{display:flex;gap:2px;flex:0 0 auto}
.icon-btn{
  width:38px;height:38px;border:0;border-radius:50%;
  background:transparent;color:#fff;cursor:pointer;font-size:17px;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s ease,transform .15s ease;
  touch-action:manipulation;
}
.icon-btn:hover{background:rgba(255,255,255,.18)}
.icon-btn:active,.send-btn:active,.emoji-btn:active{transform:scale(.92)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

.search-panel{display:none;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--card)}
.search-panel.show{display:block}
.search-panel input{width:100%;border:1px solid var(--border);outline:none;border-radius:14px;padding:10px 13px;background:var(--bg);color:var(--text)}

.menu{
  display:none;position:absolute;right:14px;top:calc(60px + env(safe-area-inset-top));
  width:200px;padding:6px;background:var(--card);border:1px solid var(--border);
  border-radius:16px;box-shadow:var(--shadow);z-index:20;overflow:hidden;
}
.menu.show{display:block;animation:panelIn .15s ease both}
.menu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:11px 10px;border-radius:10px;color:var(--text);cursor:pointer;font-size:14px}
.menu button:hover{background:var(--soft)}

.profile-modal{display:none;position:fixed;inset:0;background:rgba(4,20,32,.5);backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center;padding:18px}
.profile-modal.show{display:flex}
.profile-card{width:min(440px,100%);max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:24px;animation:panelIn .2s ease both}
.profile-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.profile-top h3{font-size:19px}
.profile-close{border:0;background:var(--soft);color:var(--text);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px}
.profile-avatar{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--sky-deep));color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;margin:0 auto 10px;box-shadow:var(--shadow-sm)}
.profile-email{text-align:center;color:var(--muted);font-size:12px;margin-bottom:18px}
.profile-grid{display:grid;gap:12px}
.profile-field label{display:block;font-size:12px;font-weight:700;margin:0 0 6px;color:var(--muted)}
.profile-field input,.profile-field textarea{width:100%;border:1px solid var(--border);border-radius:13px;background:var(--bg);color:var(--text);padding:11px 12px;outline:none;transition:border-color .15s ease}
.profile-field textarea{min-height:78px;resize:vertical}
.profile-field input:focus,.profile-field textarea:focus{border-color:var(--sky)}
.account-since{margin-top:14px;padding:12px 13px;background:var(--soft);border-radius:13px;font-size:13px;color:var(--text)}
.profile-actions{display:flex;gap:8px;margin-top:18px}
.profile-actions button{flex:1;border:0;border-radius:13px;padding:12px;cursor:pointer;font-weight:600;font-size:14px}
.profile-cancel{background:var(--soft);color:var(--text)}
.profile-save{background:linear-gradient(135deg,var(--sky),var(--sky-deep));color:#fff}

/* Chat area */
.chat-area{flex:1;min-height:0;overflow-y:auto;padding:20px 18px 10px;scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.chat-area::-webkit-scrollbar{width:6px}
.chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
.welcome{text-align:center;color:var(--muted);padding:60px 15px}
.welcome .heart{font-size:44px;margin-bottom:10px}
.welcome h3{color:var(--text);margin-bottom:6px;font-size:18px}

.message-row{display:flex;margin:6px 0;animation:messageIn .2s ease both}
.message-row.mine{justify-content:flex-end}
.message-row.theirs{justify-content:flex-start}
.bubble-wrap{max-width:min(76%,600px);position:relative}
.bubble{
  padding:10px 14px;border-radius:20px;
  transition:transform .15s ease,box-shadow .15s ease;
  word-break:break-word;white-space:pre-wrap;line-height:1.48;
  font-size:14.5px;
  border:1px solid var(--border);background:var(--card);
  box-shadow:var(--shadow-sm);
}
.mine .bubble{background:var(--mine);color:#fff;border:0;border-bottom-right-radius:6px;box-shadow:0 8px 20px rgba(10,132,217,.28)}
.theirs .bubble{border-bottom-left-radius:6px}
.reply-quote{padding:7px 9px;margin-bottom:7px;border-left:3px solid rgba(255,255,255,.85);background:rgba(255,255,255,.18);border-radius:8px;font-size:12px;opacity:.92}
.theirs .reply-quote{border-left-color:var(--sky);background:var(--soft)}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:5px;font-size:10px;margin-top:4px;opacity:.75}
.tick{letter-spacing:-2px}
.mine .tick.seen{color:#d6f2ff}
.reaction{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:10px;background:var(--soft);font-size:13px;box-shadow:var(--shadow-sm)}

.message-row{transition:margin-bottom .15s ease}
.actions{display:none;position:absolute;top:-36px;right:0;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;box-shadow:var(--shadow);white-space:nowrap;gap:1px;z-index:5}
.theirs .actions{right:auto;left:0}
.message-row:hover .actions{display:flex}
.message-row.show-actions .actions{display:flex}
.actions button{border:0;background:transparent;color:var(--text);cursor:pointer;padding:6px 8px;border-radius:7px;font-size:14px;touch-action:manipulation}
.actions button:hover{background:var(--soft);color:var(--sky)}

.typing{height:22px;padding:0 20px;color:var(--muted);font-size:12px;font-style:italic}

/* Composer */
.composer{
  position:relative;flex:0 0 auto;
  padding:10px 14px;padding-bottom:max(14px,calc(14px + env(safe-area-inset-bottom)));
  border-top:1px solid var(--border);background:var(--card);
}
.reply-preview{display:none;align-items:center;justify-content:space-between;background:var(--soft);padding:9px 12px;border-radius:12px;margin-bottom:8px;font-size:12px}
.reply-preview.show{display:flex}
.reply-preview button{border:0;background:transparent;cursor:pointer;color:var(--muted)}
.input-row{display:flex;align-items:flex-end;gap:8px}
.input-box{
  flex:1;display:flex;align-items:flex-end;gap:6px;
  background:var(--bg);border:1px solid var(--border);
  border-radius:24px;padding:6px 8px;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.input-box:focus-within{border-color:var(--sky);box-shadow:0 0 0 4px rgba(14,165,233,.12)}
.input-box textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);min-height:40px;max-height:120px;padding:9px 6px;font-size:14.5px}
.send-btn{
  width:44px;height:44px;flex:0 0 44px;border:0;border-radius:50%;
  background:linear-gradient(135deg,var(--sky),var(--sky-deep));color:#fff;cursor:pointer;
  font-size:18px;box-shadow:0 8px 18px rgba(14,165,233,.35);
  transition:transform .15s ease,box-shadow .15s ease;
  display:flex;align-items:center;justify-content:center;touch-action:manipulation;
}
.send-btn:hover{box-shadow:0 10px 24px rgba(14,165,233,.42);transform:translateY(-1px)}
.emoji-btn{width:36px;height:40px;border:0;background:transparent;cursor:pointer;font-size:19px;touch-action:manipulation}

.emoji-panel{display:none;position:absolute;bottom:74px;left:14px;right:14px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:10px;box-shadow:var(--shadow);z-index:15}
.emoji-panel.show{display:grid;animation:panelIn .18s ease both;grid-template-columns:repeat(10,1fr);gap:4px}
.emoji-panel button{border:0;background:transparent;padding:7px;cursor:pointer;border-radius:9px;font-size:18px}
.emoji-panel button:hover{background:var(--soft)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0c2437;color:#fff;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:100;font-size:13px;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes appIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
@keyframes messageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes panelIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

@media(max-width:650px){
  .app{height:100dvh;padding:0}
  .chat-container{height:100dvh;min-height:100dvh;width:100%;border-radius:0;border:0}
  .chat-header{height:calc(62px + env(safe-area-inset-top));padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
  .profile{gap:9px}
  .profile h2{font-size:15px;max-width:42vw}
  .profile p{font-size:11px}
  .avatar{width:40px;height:40px;flex:0 0 40px;font-size:16px}
  .icon-btn{width:36px;height:36px;font-size:16px}
  .chat-area{padding:14px 12px 8px}
  .bubble-wrap{max-width:88%}
  .bubble{padding:9px 12px;font-size:14px}
  .composer{padding:8px 10px;padding-bottom:max(12px,calc(12px + env(safe-area-inset-bottom)))}
  .input-box{min-height:44px}
  .input-box textarea{min-height:38px;max-height:104px;padding:8px 6px}
  .send-btn{width:42px;height:42px;flex:0 0 42px}
  .emoji-panel{left:8px;right:8px;bottom:calc(68px + env(safe-area-inset-bottom));grid-template-columns:repeat(7,1fr)!important}
  .menu{right:10px;width:min(220px,calc(100vw - 20px))}
  .menu button{min-height:44px}
  .search-panel input{min-height:44px}
  .actions{top:auto;bottom:-30px}
  .actions button{min-width:36px;min-height:34px}
  .message-row.show-actions{margin-bottom:34px}
  .welcome{padding:40px 12px}
}
@media(max-width:380px){
  .header-actions .icon-btn:first-child{display:none}
  .profile h2{max-width:38vw}
  .bubble-wrap{max-width:91%}
}
</style>
</head>
<body>
<div class="app"><main class="chat-container">
<header class="chat-header">
<div class="profile">
<div class="avatar" id="partnerAvatar"><span id="partnerLetter">P</span></div>

</div>

</main></div><div id="profileModal" class="profile-modal" onclick="if(event.target===this)closeProfile()">

    <div class="profile-email" id="profileEmail"></div>
    <div class="profile-grid">
      <div class="profile-field"><label for="profileUsername">Username / name</label><input id="profileUsername" maxlength="40" placeholder="Your name"></div>
      <div class="profile-field"><label for="profileNickname">Nickname</label><input id="profileNickname" maxlength="30" placeholder="Nickname"></div>
      <div class="profile-field"><label for="profileBio">Bio</label><textarea id="profileBio" maxlength="160" placeholder="Tell something about yourself"></textarea></div>
      <div class="profile-field"><label for="profileBirthday">Birthday</label><input id="profileBirthday" type="date"></div>
    </div>
    <div class="account-since">📅 Account since <b>May 9, 2026</b></div>
    <div class="profile-actions"><button class="profile-cancel" onclick="closeProfile()">Cancel</button><button class="profile-save" onclick="saveProfile()">Save changes</button></div>
  </div>
</div><div id="toast" class="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

}[c]));
function toast(msg){
  const t=$("toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>t.classList.remove("show"),2400);
}
function toDate(v){return v?.toDate?v.toDate():(v?new Date(v):null)}
function formatTime(d){return d?new Intl.DateTimeFormat(undefined,{hour:"numeric",minute:"2-digit"}).format(d):""}
function formatSeen(d){return d?new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).format(d):""}
/* ---------- NOTIFICATION + SOUND ---------- */
function updateSoundUI(){
  const el=$("soundState");
  if(el)el.textContent=soundEnabled?"On":"Off";
}
updateSoundUI();
function toggleSound(){
  soundEnabled=!soundEnabled;
  localStorage.setItem("ponnuSound",soundEnabled?"on":"off");
  updateSoundUI();
  if(soundEnabled)playMessageSound();
}
function unlockAudio(){
  try{
    if(!audioContext){
      const Ctx=window.AudioContext||window.webkitAudioContext;
      if(!Ctx)return;
      audioContext=new Ctx();
    }
    if(audioContext.state==="suspended")audioContext.resume();
  }catch(e){console.warn("Audio unavailable",e)}
}
function playMessageSound(){
  if(!soundEnabled)return;
  try{
    unlockAudio();
    if(!audioContext)return;
    const now=audioContext.currentTime;
    const osc=audioContext.createOscillator();
    const gain=audioContext.createGain();
    osc.type="sine";
    osc.frequency.setValueAtTime(880,now);
    osc.frequency.exponentialRampToValueAtTime(660,now+0.12);
    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(0.12,now+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+0.22);
    osc.connect(gain).connect(audioContext.destination);
    osc.start(now);
    osc.stop(now+0.24);
  }catch(e){console.warn("Sound failed",e)}
}
async function showIncomingNotification(d){
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  if(document.visibilityState==="visible"&&document.hasFocus())return;
  try{
    const title=partnerUser?.displayName||"PONNU ❤️";
    const body=(d.text||"New message").slice(0,120);
    const n=new Notification(title,{body,tag:"ponnu-message",silent:true});
    n.onclick=()=>{window.focus();n.close()};
  }catch(e){console.warn("Notification failed",e)}
}
async function handleIncomingMessages(snapshot){
  if(!currentUser)return;
  if(!messagesInitialized){
    messagesInitialized=true;
    const docs=snapshot.docs;
    if(docs.length)lastNotifiedMessageId=docs[docs.length-1].id;
    return;
  }
  if(!snapshot.docChanges)return;
  for(const change of snapshot.docChanges()){
    if(change.type!=="added")continue;
    const raw=change.doc.data();
    if(raw.senderId===currentUser.uid)continue;
    if(change.doc.id===lastNotifiedMessageId)continue;
    lastNotifiedMessageId=change.doc.id;
    let d={text:"New message"};
    try{ d=await decryptPayload({...raw,__id:change.doc.id}); }catch(e){}
    playMessageSound();
    await showIncomingNotification(d);
    // FCM handles true background push; this covers the open/background-tab case.
  }
}
["pointerdown","keydown","touchstart"].forEach(evt=>{
  window.addEventListener(evt,unlockAudio,{once:false,passive:true});
});
/* ---------- AUTH / START ---------- */
onAuthStateChanged(auth,async user=>{
  if(!user){
    location.href="index.html";
    return;
  }
  if(!isMember(user.uid)){
    toast("This account is not authorized for PONNU.");
    await signOut(auth);
    return;
  }
  currentUser=user;
  console.log("Logged in:",user.email);
  try{
    await createUserProfile();
    const ownProfileSnap=await getDoc(doc(db,"users",currentUser.uid));
    currentUserProfile=ownProfileSnap.exists()?ownProfileSnap.data():{};
    await setPresence(true);
    await findPartner();
    // If this device already granted notification permission, silently refresh its FCM token.
    if("Notification" in window && Notification.permission==="granted"){
      requestNotifications().catch(()=>{});
    }
  }catch(e){
    console.error("PONNU startup error:",e);
    toast("PONNU could not start: "+e.message);
  }
});
async function createUserProfile(){
  const ref=doc(db,"users",currentUser.uid);
  const snap=await getDoc(ref);
  const existing=snap.exists()?snap.data():{};
  const data={
    email:currentUser.email||existing.email||"",
    displayName:existing.displayName||currentUser.displayName||currentUser.email?.split("@")[0]||"User",
    nickname:existing.nickname||"",
    bio:existing.bio||"",
    birthday:existing.birthday||"",
    accountSince:existing.accountSince||"2026-05-09",
    photoURL:currentUser.photoURL||existing.photoURL||"",
    online:true,
    typing:false,
    lastSeen:serverTimestamp()
  };
  if(snap.exists()) await updateDoc(ref,data);
  else await setDoc(ref,data);
}
/* ---------- MESSAGE PAYLOAD ---------- */
/* E2EE is intentionally not enabled in this version. */
async function encryptPayload(payload){
  return payload;
}
async function decryptPayload(d){
  /* Older test messages may have been created by the accidental E2EE build.
     Keep them visible as locked instead of throwing repeated console errors. */
  if(d?.ciphertext){
    return {
      text:"🔒 Older encrypted message — send a new message in this version.",
      replyTo:null
    };
  }
  return {
    text:d?.text||"",
    replyTo:d?.replyTo||null
  };
}
async function findPartner(){
  const partnerUid=currentUser.uid===USER_1?USER_2:USER_1;
  const snap=await getDoc(doc(db,"users",partnerUid));
  partnerUser={
    uid:partnerUid,
    ...(snap?.exists()?snap.data():{
      displayName:"My Person ❤️",
      email:""
    })
  };
  chatId=chatKey();
  updatePartnerUI();
  listenToPartner();
  listenToMessages();
}
/* ---------- REAL ONLINE / OFFLINE / LAST SEEN ---------- */
async function setPresence(online){
  if(!currentUser)return;
  const data=online
    ? {online:true,lastSeen:serverTimestamp()}
    : {online:false,typing:false,lastSeen:serverTimestamp()};
  try{
    await updateDoc(doc(db,"users",currentUser.uid),data);
    presenceActive=online;
  }catch(e){
    console.warn("Presence update failed:",e);
  }
}
function startPresenceHeartbeat(){
  clearInterval(presenceTimer);
  presenceTimer=setInterval(async()=>{
    if(document.visibilityState==="visible" && currentUser){
      await setPresence(true);
    }
  },30000);
}
function stopPresenceHeartbeat(){
  clearInterval(presenceTimer);
  presenceTimer=null;
}
function handlePresenceVisibility(){
  if(!currentUser)return;
  if(document.visibilityState==="visible"){
    setPresence(true);
    startPresenceHeartbeat();
    markVisibleMessagesSeen();
  }else{
    setPresence(false);
    stopPresenceHeartbeat();
  }
}
document.addEventListener("visibilitychange",handlePresenceVisibility);
window.addEventListener("focus",()=>currentUser&&setPresence(true));
window.addEventListener("blur",()=>currentUser&&setPresence(false));
/*
  beforeunload is best-effort only. Firebase cannot guarantee an async
  write finishes while a tab is being closed, so visibility/heartbeat
  are the main presence mechanisms.
*/
window.addEventListener("beforeunload",()=>{
  if(!currentUser)return;
  updateDoc(doc(db,"users",currentUser.uid),{
    online:false,
    typing:false,
    lastSeen:serverTimestamp()
  }).catch(()=>{});
});
/* ---------- PARTNER STATUS + TYPING ---------- */
function updatePartnerUI(){
  const name=partnerUser.nickname||partnerUser.displayName||partnerUser.email||"User";
  $("partnerName").textContent=name;
  $("partnerLetter").textContent=name.trim().charAt(0).toUpperCase()||"P";
  if(partnerUser.photoURL){
    $("partnerAvatar").innerHTML=
      `<img src="${escapeHtml(partnerUser.photoURL)}" alt="">`;
  }
}
function listenToPartner(){
  if(unsubscribePartner)unsubscribePartner();
  unsubscribePartner=onSnapshot(
    doc(db,"users",partnerUser.uid),
    snap=>{
      if(!snap.exists())return;
      const d=snap.data();
      const online=!!d.online;
      const typing=!!d.typing;
      $("onlineDot").classList.toggle("online",online);
      if(online){
        $("partnerStatus").textContent=typing?"Online":"Online";
      }else{
        $("partnerStatus").textContent=
          d.lastSeen
            ? `Last seen ${formatSeen(toDate(d.lastSeen))}`
            : "Offline";
      }
      $("typingArea").textContent=
        online&&typing ? `${partnerUser.nickname||partnerUser.displayName||"They"} is typing…` : "";
    },
    e=>console.error("Partner listener:",e)
  );
}
async function setTyping(isTyping){
  if(!currentUser)return;
  try{
    await updateDoc(doc(db,"users",currentUser.uid),{
      typing:isTyping,
      online:true,
      lastSeen:serverTimestamp()
    });
  }catch(e){
    console.warn("Typing update failed:",e);
  }
}
function handleTyping(){
  if(!currentUser)return;
  clearTimeout(typingTimer);
  const text=$("messageInput").value.trim();
  if(!text){
    setTyping(false);
    return;
  }
  setTyping(true);
  typingTimer=setTimeout(()=>{
    setTyping(false);
  },1200);
}
/* ---------- MESSAGES ---------- */
function listenToMessages(){
  if(unsubscribeMessages)unsubscribeMessages();
  const messagesRef=collection(db,"chats",chatId,"messages");
  const q=query(messagesRef,orderBy("createdAt","asc"),limitToLast(20));
  unsubscribeMessages=onSnapshot(
    q,
    snap=>{
      lastSnapshot=snap;
      handleIncomingMessages(snap);
      renderMessages(snap);
      markIncomingDeliveredAndSeen(snap);
    },
    e=>{
      console.error("Message listener:",e);
      toast("Chat could not load: "+e.message);
    }
  );
}
async function renderMessages(snapshot){
  const area=$("chatArea");
  area.innerHTML="";
  if(snapshot.empty){
    const welcome=document.createElement("div");
    welcome.className="welcome";
    welcome.innerHTML=`<div class="heart">❤️</div><h3>Welcome to PONNU</h3><p>Your private chat space.</p>`;
    area.appendChild(welcome);
    return;
  }
  for(const ds of snapshot.docs){
    const raw=ds.data();
    const d={...raw,__id:ds.id};
    try{
      Object.assign(d,await decryptPayload(d));
    }catch(e){
      console.warn("Message decrypt failed:",e);
      d.text="🔒 Encrypted message";
      d.replyTo=null;
    }
    area.appendChild(createMessageElement(ds.id,d));
  }
  scrollBottom();
}
function createMessageElement(id,d){
  const mine=d.senderId===currentUser.uid;
  const row=document.createElement("div");
  row.className="message-row "+(mine?"mine":"theirs");
  row.dataset.id=id;
  const wrap=document.createElement("div");
  wrap.className="bubble-wrap";
  const actions=document.createElement("div");
  actions.className="actions";
  actions.innerHTML=
    `<button onclick="replyToMessage('${id}')">↩</button>
     <button onclick="reactToMessage('${id}','❤️')">❤️</button>
     ${mine?`<button onclick="editMessage('${id}')">✏</button>
     <button onclick="deleteMessage('${id}')">🗑</button>`:""}`;
  wrap.appendChild(actions);
  const bubble=document.createElement("div");
  bubble.className="bubble";
  if(d.replyTo){
    bubble.innerHTML=
      `<div class="reply-quote">↩ ${escapeHtml(d.replyTo.text||"")}</div>`;
  }
  bubble.innerHTML+=escapeHtml(d.text||"");
  if(d.edited){
    bubble.innerHTML+=` <small>(edited)</small>`;
  }
  wrap.appendChild(bubble);
  const meta=document.createElement("div");
  meta.className="meta";
  meta.innerHTML=`<span>${formatTime(toDate(d.createdAt))}</span>`;
  if(mine){
    if(d.seen){
      meta.innerHTML+=
        `<span class="tick seen" title="Seen ${escapeHtml(formatSeen(toDate(d.seenAt)))}">✓✓</span>`;
    }else if(d.delivered){
      meta.innerHTML+=`<span class="tick" title="Delivered">✓✓</span>`;
    }else{
      meta.innerHTML+=`<span class="tick" title="Sent">✓</span>`;
    }
  }
  wrap.appendChild(meta);
  if(d.reaction){
    wrap.innerHTML+=`<span class="reaction">${escapeHtml(d.reaction)}</span>`;
  }
  row.appendChild(wrap);
  row.addEventListener("click",e=>{
    if(e.target.closest(".actions"))return;
    const wasOpen=row.classList.contains("show-actions");
    document.querySelectorAll(".message-row.show-actions").forEach(r=>r.classList.remove("show-actions"));
    if(!wasOpen)row.classList.add("show-actions");
  });
  return row;
}
async function markIncomingDeliveredAndSeen(snapshot){
  if(!currentUser||!chatId||document.visibilityState!=="visible")return;
  const writes=[];
  for(const ds of snapshot.docs){
    const raw=ds.data();
    const d={...raw,__id:ds.id};
    try{ Object.assign(d,await decryptPayload(d)); }catch(e){ console.warn("Message decrypt failed:",e); d.text="🔒 Encrypted message"; d.replyTo=null; }
    if(d.senderId===currentUser.uid)continue;
    const ref=doc(db,"chats",chatId,"messages",ds.id);
    if(!d.delivered){
      writes.push(
        updateDoc(ref,{
          delivered:true,
          deliveredAt:serverTimestamp()
        })
      );
    }
    if(!d.seen&&!seenInFlight.has(ds.id)){
      seenInFlight.add(ds.id);
      writes.push(
        updateDoc(ref,{
          seen:true,
          seenAt:serverTimestamp()
        })
      );
    }
  }
  if(writes.length){
    try{
      await Promise.all(writes);
    }catch(e){
      console.error("Receipt update:",e);
    }
  }
}
async function markVisibleMessagesSeen(){
  if(lastSnapshot){
    await markIncomingDeliveredAndSeen(lastSnapshot);
  }
}
async function sendMessage(){
  unlockAudio();
  if(!currentUser||!chatId)return;
  const input=$("messageInput");
  const text=input.value.trim();
  if(!text)return;
  try{
    const payload=await encryptPayload({
      text,
      replyTo:replyMessage
        ? {id:replyMessage.id,text:replyMessage.text}
        : null
    });
    await addDoc(
      collection(db,"chats",chatId,"messages"),
      {
        ...payload,
        senderId:currentUser.uid,
        createdAt:serverTimestamp(),
        delivered:false,
        seen:false,
        reaction:null,
        edited:false
      }
    );
    input.value="";
    autoResize();
    cancelReply();
    closeEmoji();
    setTyping(false);
    scrollBottom();
  }catch(e){
    console.error(e);
    toast("Message failed: "+e.message);
  }
}
async function editMessage(id){
  const ds=lastSnapshot?.docs.find(x=>x.id===id);
  if(!ds)return;
  const raw=ds.data();
  if(raw.senderId!==currentUser.uid)return;
  let d;
  try{ d=await decryptPayload({...raw,__id:id}); }
  catch(e){ toast("This message could not be decrypted."); return; }
  const text=prompt("Edit message:",d.text||"");
  if(text===null||!text.trim())return;
  try{
    const encrypted=await encryptPayload({text:text.trim(),replyTo:d.replyTo||null});
    await updateDoc(
      doc(db,"chats",chatId,"messages",id),
      {...encrypted,edited:true,editedAt:serverTimestamp()}
    );
    plainTextCache.delete(id);
  }catch(e){
    toast("Edit failed: "+e.message);
  }
}
async function deleteMessage(id){
  const ds=lastSnapshot?.docs.find(x=>x.id===id);
  if(!ds||ds.data().senderId!==currentUser.uid)return;
  if(!confirm("Delete this message?"))return;
  try{
    await deleteDoc(doc(db,"chats",chatId,"messages",id));
  }catch(e){
    toast("Delete failed: "+e.message);
  }
}
async function reactToMessage(id,reaction){
  try{
    await updateDoc(
      doc(db,"chats",chatId,"messages",id),
      {reaction}
    );
  }catch(e){
    toast("Reaction failed: "+e.message);
  }
}
/* ---------- REPLY / EMOJI / SEARCH ---------- */
async function replyToMessage(id){
  const ds=lastSnapshot?.docs.find(x=>x.id===id);
  if(!ds)return;
  try{
    const d=await decryptPayload({...ds.data(),__id:id});
    replyMessage={id,text:d.text||""};
    $("replyText").textContent=replyMessage.text;
    $("replyPreview").classList.add("show");
    $("messageInput").focus();
  }catch(e){
    toast("This message could not be decrypted.");
  }
}
function cancelReply(){
  replyMessage=null;
  $("replyPreview").classList.remove("show");
  $("replyText").textContent="";
}
const emojis=[
"❤️","😍","🥰","😘","😊","😂","🥹","🫶","💕","💗",
"💖","💘","✨","🫂","🥺","😌","🌸","🌙","🦋","🤍",
"👍","🤣","❤️‍🔥","😭","😎","🙈","💋","💞","💓","🌹"
];
$("emojiPanel").innerHTML=emojis
   .map(e=>`<button type="button" onclick="addEmoji('${e}')">${e}</button>`)
  .join("");
function addEmoji(e){

  input.value+=e;
  input.focus();
  autoResize();
  handleTyping();
}
function toggleEmoji(){

}
function closeEmoji(){

}
function toggleSearch(){
  $("searchPanel").classList.toggle("show");

    $("searchInput").focus();
  }
}
function searchMessages(){
  const term=$("searchInput").value.toLowerCase().trim();
  document.querySelectorAll(".message-row").forEach(row=>{
    const text=row.querySelector(".bubble")?.innerText.toLowerCase()||"";

function toggleTheme(){
  document.body.classList.toggle("dark");
  localStorage.setItem(
    "ponnuTheme",
    document.body.classList.contains("dark")?"dark":"light"
  );
}
if(localStorage.getItem("ponnuTheme")==="dark"){
  document.body.classList.add("dark");
}
function toggleMenu(){
  $("menu").classList.toggle("show");
}
function scrollBottom(){
  requestAnimationFrame(()=>{
    const area=$("chatArea");
    area.scrollTop=area.scrollHeight;
  });
}
function autoResize(){
  const input=$("messageInput");
  input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,120)+"px";
}
/* ---------- INPUT EVENTS ---------- */
$("messageInput").addEventListener("input",()=>{
  autoResize();
  handleTyping();
});
$("messageInput").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".emoji-panel")&&!e.target.closest(".emoji-btn")){
    closeEmoji();
  }
  if(!e.target.closest(".menu")&&!e.target.closest(".icon-btn")){
    $("menu").classList.remove("show");

  if(!e.target.closest(".message-row")){
    document.querySelectorAll(".message-row.show-actions").forEach(r=>r.classList.remove("show-actions"));
  }

/* ---------- PROFILE ---------- */
function openProfile(){
  if(!currentUser)return;
  const d=currentUserProfile||{};
  $("profileUsername").value=d.displayName||"";
  $("profileNickname").value=d.nickname||"";
  $("profileBio").value=d.bio||"";
  $("profileBirthday").value=d.birthday||"";
  $("profileEmail").textContent=currentUser.email||"";
  const name=d.nickname||d.displayName||"User";
  $("profileAvatar").textContent=name.trim().charAt(0).toUpperCase()||"U";
  $("profileModal").classList.add("show");
}
function closeProfile(){
  $("profileModal").classList.remove("show");
}
window.openProfile = openProfile;
window.closeProfile = closeProfile;
window.saveProfile = saveProfile;
async function saveProfile(){
  if(!currentUser)return;
  const displayName=$("profileUsername").value.trim();
  const nickname=$("profileNickname").value.trim();
  const bio=$("profileBio").value.trim();
  const birthday=$("profileBirthday").value||"";
  if(!displayName){
    toast("Please enter a username / name.");
    return;
  }
  try{
    await updateDoc(doc(db,"users",currentUser.uid),{
      displayName,
      nickname,
      bio,
      birthday,
      accountSince:"2026-05-09"
    });
    currentUserProfile={...(currentUserProfile||{}),displayName,nickname,bio,birthday,accountSince:"2026-05-09"};
    $("profileAvatar").textContent=(nickname||displayName).charAt(0).toUpperCase();
    toast("Profile updated");
    closeProfile();
  }catch(e){
    console.error(e);
    toast("Could not update profile");
  }
}
/* ---------- NOTIFICATIONS / LOGOUT ---------- */
async function requestNotifications(){
  unlockAudio();
  if(!currentUser){
    toast("Login first bro ❤️");
    return;
  }
  if(!("Notification" in window)||!("serviceWorker" in navigator)){
    toast("This browser cannot use PONNU push notifications.");
    return;
  }
  if(!FCM_VAPID_KEY || FCM_VAPID_KEY==="PASTE_YOUR_PUBLIC_VAPID_KEY_HERE"){
    toast("Add your Firebase Web Push public key first.");
    console.error("PONNU: FCM_VAPID_KEY is still a placeholder.");
    return;
  }
  try{
    const supported=await isSupported();
    if(!supported){
      toast("Push notifications are not supported on this browser.");
      return;
    }
    const permission=Notification.permission==="granted"
      ?"granted"
      :await Notification.requestPermission();
    if(permission!=="granted"){
      toast("Notifications are blocked. Enable them in browser settings.");
      return;
    }
    const registration=await navigator.serviceWorker.register(
      "/firebase-messaging-sw.js",
      {scope:"/"}
    );
    await navigator.serviceWorker.ready;
    messaging=getMessaging(app);
    if(!unsubscribeForegroundMessaging){
      unsubscribeForegroundMessaging=onMessage(messaging,payload=>{
        console.log("PONNU FCM foreground message:",payload);
        const title=payload?.data?.title||payload?.notification?.title||"PONNU ❤️";
        const body=payload?.data?.body||payload?.notification?.body||"New message";
        playMessageSound();
        toast(`${title}: ${body}`);
      });
    }
    const token=await getToken(messaging,{
      vapidKey:FCM_VAPID_KEY,
      serviceWorkerRegistration:registration
    });
    if(!token){
      toast("Could not create notification token.");
      return;
    }
    await updateDoc(doc(db,"users",currentUser.uid),{
      fcmToken:token,
      fcmTokenUpdatedAt:serverTimestamp()
    });
    messagingReady=true;
    toast("Notifications enabled ❤️");
    console.log("PONNU FCM token registered.");
  }catch(e){
    console.error("PONNU push setup failed:",e);
    toast("Push setup failed: "+(e?.message||"unknown error"));
  }
}
async function logout(){
  try{
    clearTimeout(typingTimer);
    stopPresenceHeartbeat();
    if(currentUser){
      await updateDoc(
        doc(db,"users",currentUser.uid),
        {
          online:false,
          typing:false,
          lastSeen:serverTimestamp()
        }
      );
    }
    if(unsubscribeMessages)unsubscribeMessages();
    if(unsubscribePartner)unsubscribePartner();
    await signOut(auth);
  }catch(e){
    toast("Logout failed: "+e.message);
  }
}
