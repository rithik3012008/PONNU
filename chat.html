<script type="module">

const USER_1="2DC3rL5qhoXLXejPvmHj85c4XxF2";

let currentUser=null;

function toast(msg){
  const t=$("toast");

/* ---------- NOTIFICATION + SOUND ---------- */

function updateSoundUI(){
  const el=$("soundState");
  if(el)el.textContent=soundEnabled?"On":"Off";
}
updateSoundUI();

function toggleSound(){
  soundEnabled=!soundEnabled;
  localStorage.setItem("ponnuSound",soundEnabled?"on":"off");
  updateSoundUI();
  if(soundEnabled)playMessageSound();
}

function unlockAudio(){
  try{
    if(!audioContext){
      const Ctx=window.AudioContext||window.webkitAudioContext;
      if(!Ctx)return;
      audioContext=new Ctx();
    }
    if(audioContext.state==="suspended")audioContext.resume();
  }catch(e){console.warn("Audio unavailable",e)}
}

function playMessageSound(){
  if(!soundEnabled)return;
  try{
    unlockAudio();
    if(!audioContext)return;
    const now=audioContext.currentTime;
    const osc=audioContext.createOscillator();
    const gain=audioContext.createGain();
    osc.type="sine";
    osc.frequency.setValueAtTime(880,now);
    osc.frequency.exponentialRampToValueAtTime(660,now+0.12);
    gain.gain.setValueAtTime(0.0001,now);
    gain.gain.exponentialRampToValueAtTime(0.12,now+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001,now+0.22);
    osc.connect(gain).connect(audioContext.destination);
    osc.start(now);
    osc.stop(now+0.24);
  }catch(e){console.warn("Sound failed",e)}
}

async function showIncomingNotification(d){
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  if(document.visibilityState==="visible"&&document.hasFocus())return;
  try{
    const title=partnerUser?.displayName||"PONNU ❤️";
    const body=(d.text||"New message").slice(0,120);
    const n=new Notification(title,{body,tag:"ponnu-message",silent:true});
    n.onclick=()=>{window.focus();n.close()};
  }catch(e){console.warn("Notification failed",e)}
}

async function handleIncomingMessages(snapshot){
  if(!currentUser)return;
  if(!messagesInitialized){
    messagesInitialized=true;
    const docs=snapshot.docs;
    if(docs.length)lastNotifiedMessageId=docs[docs.length-1].id;
    return;
  }
  if(!snapshot.docChanges)return;
  for(const change of snapshot.docChanges()){
    if(change.type!=="added")continue;
    const raw=change.doc.data();
    if(raw.senderId===currentUser.uid)continue;
    if(change.doc.id===lastNotifiedMessageId)continue;
    lastNotifiedMessageId=change.doc.id;
    let d={text:"New message"};
    try{ d=await decryptPayload({...raw,__id:change.doc.id}); }catch(e){}
    playMessageSound();
    showIncomingNotification(d);
  }
}

["pointerdown","keydown","touchstart"].forEach(evt=>{

});

/* ---------- AUTH / START ---------- */

onAuthStateChanged(auth,async user=>{
  if(!user){
    location.href="index.html";
    return;
  }

  if(!isMember(user.uid)){
    toast("This account is not authorized for PONNU.");
    await signOut(auth);

  currentUser=user;
  console.log("Logged in:",user.email);

  try{
    await createUserProfile();
    const ownProfileSnap=await getDoc(doc(db,"users",currentUser.uid));
    currentUserProfile=ownProfileSnap.exists()?ownProfileSnap.data():{};
    await setPresence(true);
    await findPartner();
  }catch(e){
    console.error("PONNU startup error:",e);
    toast("PONNU could not start: "+e.message);
  }
});

async function createUserProfile(){
  const ref=doc(db,"users",currentUser.uid);
  const snap=await getDoc(ref);

  const existing=snap.exists()?snap.data():{};
  const data={
    email:currentUser.email||existing.email||"",
    displayName:existing.displayName||currentUser.displayName||currentUser.email?.split("@")[0]||"User",
    nickname:existing.nickname||"",
    bio:existing.bio||"",
    birthday:existing.birthday||"",
    accountSince:existing.accountSince||"2026-05-09",
    photoURL:currentUser.photoURL||existing.photoURL||"",
    online:true,
    typing:false,
    lastSeen:serverTimestamp()
  };

  if(snap.exists()) await updateDoc(ref,data);
  else await setDoc(ref,data);
}

/* ---------- MESSAGE PAYLOAD ---------- */
/* E2EE is intentionally not enabled in this version. */
async function encryptPayload(payload){
  return payload;
}

async function decryptPayload(d){
  /* Older test messages may have been created by the accidental E2EE build.
     Keep them visible as locked instead of throwing repeated console errors. */
  if(d?.ciphertext){
    return {
      text:"🔒 Older encrypted message — send a new message in this version.",
      replyTo:null
    };
  }
  return {
    text:d?.text||"",
    replyTo:d?.replyTo||null
  };
}

async function findPartner(){
  const partnerUid=currentUser.uid===USER_1?USER_2:USER_1;
  const snap=await getDoc(doc(db,"users",partnerUid));

  partnerUser={
    uid:partnerUid,
    ...(snap.exists()?snap.data():{
      displayName:"My Person ❤️",
      email:""
    })
  };

  chatId=chatKey();

  updatePartnerUI();
  listenToPartner();
  listenToMessages();
}

/* ---------- REAL ONLINE / OFFLINE / LAST SEEN ---------- */

async function setPresence(online){
  if(!currentUser)return;

  const data=online
    ? {online:true,lastSeen:serverTimestamp()}
    : {online:false,typing:false,lastSeen:serverTimestamp()};

  try{
    await updateDoc(doc(db,"users",currentUser.uid),data);
    presenceActive=online;
  }catch(e){
    console.warn("Presence update failed:",e);
  }
}

function startPresenceHeartbeat(){
  clearInterval(presenceTimer);

  presenceTimer=setInterval(async()=>{
    if(document.visibilityState==="visible" && currentUser){
      await setPresence(true);
    }
  },30000);
}

function stopPresenceHeartbeat(){
  clearInterval(presenceTimer);
  presenceTimer=null;
}

function handlePresenceVisibility(){
  if(!currentUser)return;

  if(document.visibilityState==="visible"){
    setPresence(true);
    startPresenceHeartbeat();
    markVisibleMessagesSeen();
  }else{
    setPresence(false);
    stopPresenceHeartbeat();
  }
}

document.addEventListener("visibilitychange",handlePresenceVisibility);

window.addEventListener("focus",()=>currentUser&&setPresence(true));
window.addEventListener("blur",()=>currentUser&&setPresence(false));

/*
  beforeunload is best-effort only. Firebase cannot guarantee an async
  write finishes while a tab is being closed, so visibility/heartbeat
  are the main presence mechanisms.
*/
window.addEventListener("beforeunload",()=>{
  if(!currentUser)return;
  updateDoc(doc(db,"users",currentUser.uid),{
    online:false,
    typing:false,
    lastSeen:serverTimestamp()
  }).catch(()=>{});
});

/* ---------- PARTNER STATUS + TYPING ---------- */

function updatePartnerUI(){
  const name=partnerUser.nickname||partnerUser.displayName||partnerUser.email||"User";

  $("partnerName").textContent=name;
  $("partnerLetter").textContent=name.trim().charAt(0).toUpperCase()||"P";

  if(partnerUser.photoURL){
    $("partnerAvatar").innerHTML=
      `<img src="${escapeHtml(partnerUser.photoURL)}" alt="">`;
  }
}

function listenToPartner(){
  if(unsubscribePartner)unsubscribePartner();

  unsubscribePartner=onSnapshot(
    doc(db,"users",partnerUser.uid),
    snap=>{
      if(!snap.exists())return;

      const d=snap.data();
      const online=!!d.online;
      const typing=!!d.typing;

      $("onlineDot").classList.toggle("online",online);

      if(online){
        $("partnerStatus").textContent=typing?"Online":"Online";
      }else{
        $("partnerStatus").textContent=
          d.lastSeen
            ? `Last seen ${formatSeen(toDate(d.lastSeen))}`
            : "Offline";
      }

      $("typingArea").textContent=
        online&&typing ? `${partnerUser.nickname||partnerUser.displayName||"They"} is typing…` : "";
    },
    e=>console.error("Partner listener:",e)
  );
}

async function setTyping(isTyping){
  if(!currentUser)return;

  try{
    await updateDoc(doc(db,"users",currentUser.uid),{
      typing:isTyping,
      online:true,
      lastSeen:serverTimestamp()
    });
  }catch(e){
    console.warn("Typing update failed:",e);
  }
}

function handleTyping(){
  if(!currentUser)return;

  clearTimeout(typingTimer);

  const text=$("messageInput").value.trim();

  if(!text){
    setTyping(false);
    return;
  }

  setTyping(true);

  typingTimer=setTimeout(()=>{
    setTyping(false);
  },1200);
}

/* ---------- MESSAGES ---------- */

function listenToMessages(){
  if(unsubscribeMessages)unsubscribeMessages();

  const messagesRef=collection(db,"chats",chatId,"messages");
  const q=query(messagesRef,orderBy("createdAt","asc"),limitToLast(20));

  unsubscribeMessages=onSnapshot(
    q,
    snap=>{
      lastSnapshot=snap;
      handleIncomingMessages(snap);
      renderMessages(snap);
      markIncomingDeliveredAndSeen(snap);
    },
    e=>{
      console.error("Message listener:",e);
      toast("Chat could not load: "+e.message);
    }
  );
}

async function renderMessages(snapshot){
  const area=$("chatArea");
  area.innerHTML="";

  if(snapshot.empty){
    const welcome=document.createElement("div");
    welcome.className="welcome";
    welcome.innerHTML=`<div class="heart">❤️</div><h3>Welcome to PONNU</h3><p>Your private chat space.</p>`;
    area.appendChild(welcome);
    return;
  }

  refreshPinnedUI(snapshot);

  for(const ds of snapshot.docs){
    const raw=ds.data();
    const d={...raw,__id:ds.id};
    try{
      Object.assign(d,await decryptPayload(d));
    }catch(e){
      console.warn("Message decrypt failed:",e);
      d.text="🔒 Encrypted message";
      d.replyTo=null;
    }
    area.appendChild(createMessageElement(ds.id,d));
  }

  scrollBottom();
}

function createMessageElement(id,d){
  const mine=d.senderId===currentUser.uid;

  const row=document.createElement("div");
  row.className="message-row "+(mine?"mine":"theirs");
  row.dataset.id=id;

  const wrap=document.createElement("div");
  wrap.className="bubble-wrap";

  const actions=document.createElement("div");
  actions.className="actions";

  actions.innerHTML=
    `<button onclick="replyToMessage('${id}')">↩</button>
     <button onclick="togglePinMessage('${id}')">📌</button>
     <button onclick="reactToMessage('${id}','❤️')">❤️</button>
     ${mine?`<button onclick="editMessage('${id}')">✏</button>
     <button onclick="deleteMessage('${id}')">🗑</button>`:""}`;

  wrap.appendChild(actions);

  const bubble=document.createElement("div");
  bubble.className="bubble";

  if(d.replyTo){
    bubble.innerHTML=
      `<div class="reply-quote">↩ ${escapeHtml(d.replyTo.text||"")}</div>`;
  }

  bubble.innerHTML+=escapeHtml(d.text||"");

  if(d.edited){
    bubble.innerHTML+=` <small>(edited)</small>`;
  }

  wrap.appendChild(bubble);

  if(d.pinned){
    const pinBadge=document.createElement("div");
    pinBadge.className="pin-badge";
    pinBadge.textContent="📌 Pinned";
    wrap.appendChild(pinBadge);
  }

  const meta=document.createElement("div");
  meta.className="meta";

  meta.innerHTML=`<span>${formatTime(toDate(d.createdAt))}</span>`;

  if(mine){
    if(d.seen){
      meta.innerHTML+=
        `<span class="tick seen" title="Seen ${escapeHtml(formatSeen(toDate(d.seenAt)))}">✓✓</span>`;
    }else if(d.delivered){
      meta.innerHTML+=`<span class="tick" title="Delivered">✓✓</span>`;
    }else{
      meta.innerHTML+=`<span class="tick" title="Sent">✓</span>`;
    }
  }

  wrap.appendChild(meta);

  if(d.reaction){
    wrap.innerHTML+=`<span class="reaction">${escapeHtml(d.reaction)}</span>`;
  }

  row.appendChild(wrap);
  return row;
}

/* ---------- PINNED MESSAGES ---------- */

function getPinnedDocs(snapshot){
  return snapshot.docs
    .map(ds=>({id:ds.id,data:ds.data()}))
    .filter(x=>x.data?.pinned)
    .sort((a,b)=>{
      const ta=toDate(a.data.pinnedAt)?.getTime()||0;
      const tb=toDate(b.data.pinnedAt)?.getTime()||0;
      return tb-ta;
    });
}

async function togglePinMessage(id){
  if(!currentUser||!chatId)return;

  const ds=lastSnapshot?.docs.find(x=>x.id===id);
  if(!ds)return;

  const d=ds.data();
  const willPin=!d.pinned;

  try{
    await updateDoc(
      doc(db,"chats",chatId,"messages",id),
      willPin
        ? {pinned:true,pinnedAt:serverTimestamp(),pinnedBy:currentUser.uid}
        : {pinned:false,pinnedAt:null,pinnedBy:null}
    );
    toast(willPin?"📌 Message pinned":"Message unpinned");
  }catch(e){
    console.error("Pin update failed:",e);
    toast("Could not update pin");
  }
}

function refreshPinnedUI(snapshot){
  const strip=$("pinnedStrip");
  const stripText=$("pinnedStripText");
  const items=$("pinItems");

  if(!strip||!stripText||!items)return;

  const pinned=getPinnedDocs(snapshot);

  items.innerHTML="";

  if(!pinned.length){
    strip.classList.remove("show");
    items.innerHTML='<div class="pin-item" style="cursor:default;color:var(--muted)">No pinned messages yet.</div>';
    return;
  }

  const first=pinned[0].data;
  strip.classList.add("show");
  stripText.textContent=(first.text||"Pinned message").replace(/\s+/g," ").trim();

  for(const item of pinned){
    const div=document.createElement("div");
    div.className="pin-item";
    div.textContent="📌 "+((item.data.text||"Pinned message").replace(/\s+/g," ").trim());
    div.onclick=()=>jumpToMessage(item.id);
    items.appendChild(div);
  }
}

function togglePinnedList(){
  const list=$("pinList");
  if(list)list.classList.toggle("show");
}

function jumpToPinned(){
  const pinned=getPinnedDocs(lastSnapshot);
  if(!pinned.length){
    toast("No pinned messages");
    return;
  }
  jumpToMessage(pinned[0].id);
}

function jumpToMessage(id){
  const el=document.querySelector(`.message-row[data-id="${CSS.escape(id)}"]`);
  if(!el){
    toast("That message is not in the latest 20 messages");
    return;
  }

  $("pinList")?.classList.remove("show");
  el.scrollIntoView({behavior:"smooth",block:"center"});
  el.animate(
    [
      {transform:"scale(1)",boxShadow:"0 0 0 rgba(239,86,134,0)"},
      {transform:"scale(1.03)",boxShadow:"0 0 0 6px rgba(239,86,134,.18)"},
      {transform:"scale(1)",boxShadow:"0 0 0 rgba(239,86,134,0)"}
    ],
    {duration:650}
  );
}

document.addEventListener("click",e=>{
  const list=$("pinList");
  const button=e.target.closest?.('[onclick="togglePinnedList()"]');
  if(list?.classList.contains("show") && !list.contains(e.target) && !button){
    list.classList.remove("show");
  }
});

async function markIncomingDeliveredAndSeen(snapshot){
  if(!currentUser||!chatId||document.visibilityState!=="visible")return;

  const writes=[];

  for(const ds of snapshot.docs){
    const raw=ds.data();
    const d={...raw,__id:ds.id};
    try{ Object.assign(d,await decryptPayload(d)); }catch(e){ console.warn("Message decrypt failed:",e); d.text="🔒 Encrypted message"; d.replyTo=null; }

    if(d.senderId===currentUser.uid)continue;

    const ref=doc(db,"chats",chatId,"messages",ds.id);

    if(!d.delivered){
      writes.push(
        updateDoc(ref,{
          delivered:true,
          deliveredAt:serverTimestamp()
        })
      );
    }

    if(!d.seen&&!seenInFlight.has(ds.id)){
      seenInFlight.add(ds.id);

      writes.push(
        updateDoc(ref,{
          seen:true,
          seenAt:serverTimestamp()
        })
      );
    }
  }

  if(writes.length){
    try{
      await Promise.all(writes);
    }catch(e){
      console.error("Receipt update:",e);
    }
  }
}

async function markVisibleMessagesSeen(){
  if(lastSnapshot){
    await markIncomingDeliveredAndSeen(lastSnapshot);
  }
}

async function sendMessage(){
  unlockAudio();
  if(!currentUser||!chatId)return;

  const input=$("messageInput");
  const text=input.value.trim();

  if(!text)return;

  try{
    const payload=await encryptPayload({
      text,
      replyTo:replyMessage
        ? {id:replyMessage.id,text:replyMessage.text}
        : null
    });

    await addDoc(
      collection(db,"chats",chatId,"messages"),
      {
        ...payload,
        senderId:currentUser.uid,
        createdAt:serverTimestamp(),
        delivered:false,
        seen:false,
        reaction:null,
        edited:false
      }
    );

    input.value="";
    autoResize();
    cancelReply();
    closeEmoji();
    setTyping(false);
    scrollBottom();

  }catch(e){
    console.error(e);
    toast("Message failed: "+e.message);
  }
}

async function editMessage(id){
  const ds=lastSnapshot?.docs.find(x=>x.id===id);
  if(!ds)return;

  const raw=ds.data();
  if(raw.senderId!==currentUser.uid)return;

  let d;
  try{ d=await decryptPayload({...raw,__id:id}); }
  catch(e){ toast("This message could not be decrypted."); return; }

  const text=prompt("Edit message:",d.text||"");
  if(text===null||!text.trim())return;

  try{
    const encrypted=await encryptPayload({text:text.trim(),replyTo:d.replyTo||null});
    await updateDoc(
      doc(db,"chats",chatId,"messages",id),
      {...encrypted,edited:true,editedAt:serverTimestamp()}
    );
    plainTextCache.delete(id);
  }catch(e){
    toast("Edit failed: "+e.message);
  }
}

async function deleteMessage(id){
  const ds=lastSnapshot?.docs.find(x=>x.id===id);

  if(!ds||ds.data().senderId!==currentUser.uid)return;

  if(!confirm("Delete this message?"))return;

  try{
    await deleteDoc(doc(db,"chats",chatId,"messages",id));
  }catch(e){
    toast("Delete failed: "+e.message);
  }
}

async function reactToMessage(id,reaction){
  try{
    await updateDoc(
      doc(db,"chats",chatId,"messages",id),
      {reaction}
    );
  }catch(e){
    toast("Reaction failed: "+e.message);
  }
}

/* ---------- REPLY / EMOJI / SEARCH ---------- */

async function replyToMessage(id){
  const ds=lastSnapshot?.docs.find(x=>x.id===id);
  if(!ds)return;

  try{
    const d=await decryptPayload({...ds.data(),__id:id});
    replyMessage={id,text:d.text||""};
    $("replyText").textContent=replyMessage.text;
    $("replyPreview").classList.add("show");
    $("messageInput").focus();
  }catch(e){
    toast("This message could not be decrypted.");
  }
}

function cancelReply(){
  replyMessage=null;
  $("replyPreview").classList.remove("show");
  $("replyText").textContent="";
}

const emojis=[
"❤️","😍","🥰","😘","😊","😂","🥹","🫶","💕","💗",
"💖","💘","✨","🫂","🥺","😌","🌸","🌙","🦋","🤍",
"👍","🤣","❤️‍🔥","😭","😎","🙈","💋","💞","💓","🌹"
];

$("emojiPanel").innerHTML=emojis
  .map(e=>`<button type="button" onclick="addEmoji('${e}')">${e}</button>`)
  .join("");

function addEmoji(e){
  const input=$("messageInput");
  input.value+=e;
  input.focus();
  autoResize();
  handleTyping();
}

function toggleEmoji(){
  $("emojiPanel").classList.toggle("show");
}

function closeEmoji(){
  $("emojiPanel").classList.remove("show");
}

function toggleSearch(){
  $("searchPanel").classList.toggle("show");

  if($("searchPanel").classList.contains("show")){
    $("searchInput").focus();
  }
}

function searchMessages(){
  const term=$("searchInput").value.toLowerCase().trim();

  document.querySelectorAll(".message-row").forEach(row=>{
    const text=row.querySelector(".bubble")?.innerText.toLowerCase()||"";
    row.style.display=!term||text.includes(term)?"flex":"none";
  });
}

function toggleTheme(){
  document.body.classList.toggle("dark");

  localStorage.setItem(
    "ponnuTheme",
    document.body.classList.contains("dark")?"dark":"light"
  );
}

if(localStorage.getItem("ponnuTheme")==="dark"){
  document.body.classList.add("dark");
}

function toggleMenu(){
  $("menu").classList.toggle("show");
}

function scrollBottom(){
  requestAnimationFrame(()=>{
    const area=$("chatArea");
    area.scrollTop=area.scrollHeight;
  });
}

function autoResize(){
  const input=$("messageInput");
  input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,120)+"px";
}

/* ---------- INPUT EVENTS ---------- */

$("messageInput").addEventListener("input",()=>{
  autoResize();
  handleTyping();
});

$("messageInput").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

document.addEventListener("click",e=>{
  if(!e.target.closest(".pin-list") && !e.target.closest("[onclick*=togglePinnedList]")) $("pinList")?.classList.remove("show");
  if(!e.target.closest(".emoji-panel")&&!e.target.closest(".emoji-btn")){
    closeEmoji();
  }

  if(!e.target.closest(".menu")&&!e.target.closest(".icon-btn")){
    $("menu").classList.remove("show");
  }
});

/* ---------- PROFILE ---------- */
function openProfile(){
  if(!currentUser)return;
  const d=currentUserProfile||{};
  $("profileUsername").value=d.displayName||"";
  $("profileNickname").value=d.nickname||"";
  $("profileBio").value=d.bio||"";
  $("profileBirthday").value=d.birthday||"";
  $("profileEmail").textContent=currentUser.email||"";
  const name=d.nickname||d.displayName||"User";
  $("profileAvatar").textContent=name.trim().charAt(0).toUpperCase()||"U";
  $("profileModal").classList.add("show");
}
function closeProfile(){
  $("profileModal").classList.remove("show");
}
window.openProfile = openProfile;
window.closeProfile = closeProfile;
window.saveProfile = saveProfile;

async function saveProfile(){
  if(!currentUser)return;
  const displayName=$("profileUsername").value.trim();
  const nickname=$("profileNickname").value.trim();
  const bio=$("profileBio").value.trim();
  const birthday=$("profileBirthday").value||"";
  if(!displayName){
    toast("Please enter a username / name.");
    return;
  }
  try{
    await updateDoc(doc(db,"users",currentUser.uid),{
      displayName,
      nickname,
      bio,
      birthday,
      accountSince:"2026-05-09"
    });
    currentUserProfile={...(currentUserProfile||{}),displayName,nickname,bio,birthday,accountSince:"2026-05-09"};
    $("profileAvatar").textContent=(nickname||displayName).charAt(0).toUpperCase();
    toast("Profile updated");
    closeProfile();
  }catch(e){
    console.error(e);
    toast("Could not update profile");
  }
}

/* ---------- NOTIFICATIONS / LOGOUT ---------- */

async function requestNotifications(){
  unlockAudio();
  if(!("Notification" in window)){
    toast("Notifications are not supported here.");
    return;
  }

  try{
    const permission=await Notification.requestPermission();

    toast(
      permission==="granted"
        ?"Notifications enabled ❤️"
        :"Notifications not enabled"
    );
  }catch(e){
    toast("Notification permission failed");
  }
}

async function logout(){
  try{
    clearTimeout(typingTimer);
    stopPresenceHeartbeat();

    if(currentUser){
      await updateDoc(
        doc(db,"users",currentUser.uid),
        {
          online:false,
          typing:false,
          lastSeen:serverTimestamp()
        }
      );
    }

    if(unsubscribeMessages)unsubscribeMessages();
    if(unsubscribePartner)unsubscribePartner();

    await signOut(auth);

  }catch(e){
    toast("Logout failed: "+e.message);
  }
}

/* ---------- EXPOSE HTML BUTTON FUNCTIONS ---------- */

window.toggleSearch=toggleSearch;
window.toggleTheme=toggleTheme;
window.toggleMenu=toggleMenu;
window.requestNotifications=requestNotifications;
window.logout=logout;
window.sendMessage=sendMessage;
window.toggleEmoji=toggleEmoji;
window.addEmoji=addEmoji;
window.cancelReply=cancelReply;
window.replyToMessage=replyToMessage;
window.editMessage=editMessage;
window.deleteMessage=deleteMessage;
window.reactToMessage=reactToMessage;
window.searchMessages=searchMessages;
window.openProfile=openProfile;
window.closeProfile=closeProfile;
window.saveProfile=saveProfile;
window.toggleSound=toggleSound;
window.togglePinMessage=togglePinMessage;
window.togglePinnedList=togglePinnedList;
window.jumpToPinned=jumpToPinned;

</script>
